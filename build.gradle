plugins {
    id 'fabric-loom' version '1.16.3'
}

version = project.properties['mod_version'] ?: '1.0.0'
group = 'net.samue.autoclicker'

base {
    archivesName = 'autoclicker'
}

repositories {
    mavenCentral()
}

loom {
    runs {
        // dev-only self test: gradle runClientGametest
        clientGametest {
            client()
            name = "Client Game Test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=autoclicker"
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'group', project.group
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'group': project.group
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}
